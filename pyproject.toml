[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-player-performance"
version = "0.1.0"
description = "Daily NFL stats pipeline that ranks players by position."
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "httpx>=0.27",
    "lightgbm>=4.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.7",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
nfl-pipeline = "nfl_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["pipeline"]
include = ["nfl_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["pipeline"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Research scripts carry long descriptive strings and printed tables; readability beats wrapping.
"research/*.py" = ["E501"]
