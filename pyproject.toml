[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-player-performance"
version = "0.1.0"
description = "Daily NFL stats pipeline that ranks players by position."
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "httpx>=0.27",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
nfl-pipeline = "nfl_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["pipeline"]
include = ["nfl_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["pipeline"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
