version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # The linter and Next need TypeScript's JavaScript API, which TypeScript 7 does not publish yet
      # (typescript-eslint throws "does not support TS 7.0"). They stay on 6.0.x; the type-check runs
      # on 7.x through the typescript-native alias. Remove once typescript-eslint supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The types should match the Node major the site is built with (22 in CI, 24 locally), not
      # run ahead of it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/bootstrap
    schedule:
      interval: weekly
