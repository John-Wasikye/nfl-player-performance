name: Terraform plan

# Shows what an infrastructure change would do, on pull requests. Read-only: the role it assumes can
# look at the infrastructure but cannot change it, and cannot read the data buckets. Applying stays a
# deliberate manual step from the laptop.

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/plan.yml"

permissions:
  contents: read
  id-token: write # lets the job ask GitHub for the signed token AWS checks

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-plan
          aws-region: us-east-1
          role-session-name: terraform-plan
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform init -input=false
      # -lock=false: this role cannot write to the state bucket, and a plan changes nothing anyway.
      - name: Plan
        run: terraform plan -input=false -lock=false -no-color | tee plan.txt
      - name: Show the plan on the run summary
        if: always()
        run: |
          {
            echo '### Terraform plan'
            echo '```'
            tail -c 60000 plan.txt 2>/dev/null || echo 'no plan produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
