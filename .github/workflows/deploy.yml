name: Deploy

# Runs when a change lands on main (branch protection means its checks already passed). Ships the
# pipeline image and the website. The role it assumes can do those two things and nothing else: it
# cannot change infrastructure, touch IAM or billing, read the records, or overwrite data/v1/.

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPOSITORY: nfl-player-performance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-deploy
          aws-region: us-east-1
          role-session-name: deploy-image
      - name: Build and push the pipeline image
        env:
          REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
        run: |
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin "$REGISTRY"
          docker build --platform linux/amd64 \
            -t "$REGISTRY/$REPOSITORY:$GITHUB_SHA" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$GITHUB_SHA"
          docker push "$REGISTRY/$REPOSITORY:latest"

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-deploy
          aws-region: us-east-1
          role-session-name: deploy-site
      - name: Upload the site and refresh the cache
        run: bash scripts/deploy-site.sh
